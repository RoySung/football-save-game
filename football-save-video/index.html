<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Football Save Promotional Video</title>
    <!-- Load rounded cute fonts to match the game style -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
        font-family: 'Nunito', 'M PLUS Rounded 1c', sans-serif;
      }

      /* Composition Root */
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: linear-gradient(to bottom, #0288d1 0%, #81d4fa 60%, #e0f7fa 100%);
      }

      /* Background Layer */
      #stadium-bg {
        position: absolute;
        inset: 0;
        background-image: url('assets/bg_stadium.png');
        background-size: cover;
        background-position: center;
        width: 100%;
        height: 100%;
      }

      /* Clouds Drift Overlay */
      #clouds-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .cloud {
        position: absolute;
        background-image: url('assets/cloud-sprite.png');
        background-repeat: no-repeat;
        opacity: 0.85;
      }
      .cloud-1 {
        width: 598px;
        height: 396px;
        background-position: -310px -122px;
        top: 30px;
        left: 100px;
        transform: scale(0.6);
      }
      .cloud-2 {
        width: 928px;
        height: 406px;
        background-position: -1364px -112px;
        top: 100px;
        right: 150px;
        transform: scale(0.5);
      }
      .cloud-3 {
        width: 1068px;
        height: 558px;
        background-position: -75px -712px;
        top: -80px;
        left: 700px;
        transform: scale(0.4);
      }

      /* Stadium Light Glows */
      .glow-light {
        position: absolute;
        background: radial-gradient(circle, rgba(254, 219, 65, 0.25) 0%, rgba(254, 219, 65, 0) 70%);
        border-radius: 50%;
        pointer-events: none;
      }
      #glow-left {
        width: 600px;
        height: 600px;
        left: -100px;
        top: -100px;
      }
      #glow-right {
        width: 600px;
        height: 600px;
        right: -100px;
        top: -100px;
      }

      /* Common Sprites & Card styling */
      .clip {
        position: absolute;
        will-change: transform, opacity;
      }

      .sprite-cat {
        width: 320px;
        height: 320px;
        background-size: 640px 640px; /* 2x2 frame grid */
        background-repeat: no-repeat;
        position: absolute;
        inset: 0;
      }

      /* Character Animations Frame offsets (Corrected for 2x2 sheet) */
      .gk-idle {
        background-image: url('assets/goalkeeper_sheet.png');
        background-position: 0px -320px; /* Frame 2 (bottom-left) */
      }
      .gk-dive-right {
        background-image: url('assets/goalkeeper_sheet.png');
        background-position: -320px 0px; /* Frame 1 (top-right) */
      }
      .gk-dive-left {
        background-image: url('assets/goalkeeper_sheet.png');
        background-position: -320px -320px; /* Frame 3 (bottom-right) */
      }
      .gk-jump {
        background-image: url('assets/goalkeeper_sheet.png');
        background-position: 0px 0px; /* Frame 0 (top-left) */
      }

      .striker-idle {
        background-image: url('assets/striker_sheet.png');
        background-position: 0px 0px; /* Frame 0 (top-left) */
      }
      .striker-kick-right {
        background-image: url('assets/striker_sheet.png');
        background-position: -320px 0px; /* Frame 1 (top-right) */
      }
      .striker-kick-left {
        background-image: url('assets/striker_sheet.png');
        background-position: -320px -320px; /* Frame 3 (bottom-right) */
      }

      /* Scene 1 (Hook) Elements */
      #game-logo {
        width: 600px;
        height: auto;
        left: 660px;
        top: 150px;
      }
      .logo-inner {
        width: 100%;
        height: auto;
        filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.25));
        will-change: transform, opacity;
      }

      #gk-cameo {
        width: 320px;
        height: 320px;
        left: 320px;
        bottom: 80px;
      }
      #striker-cameo {
        width: 320px;
        height: 320px;
        right: 320px;
        bottom: 80px;
      }

      #intro-football {
        z-index: 10;
      }

      /* Portrait iPhone 16 Mockup Styling (Stereoscopic metallic bevels) */
      .portrait-phone {
        position: relative;
        width: 380px;
        height: 675px;
        border: 10px solid #1f1f1f; /* Thin sleek iPhone border */
        background-color: #000;
        border-radius: 44px;
        /* Stereoscopic titanium outer highlights and inner glass glow */
        box-shadow:
          0 25px 50px rgba(0, 0, 0, 0.45),
          inset 0 0 12px rgba(255, 255, 255, 0.25),
          0 0 0 3px #111,
          0 0 0 4px #444,
          0 0 0 6px #222;
      }
      /* iPhone Dynamic Island notch */
      .portrait-phone .phone-notch {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 110px;
        height: 28px;
        background-color: #111;
        border-radius: 14px;
        z-index: 12;
        box-shadow: inset 0 0 4px rgba(255, 255, 255, 0.1);
      }
      .phone-screen-container {
        position: absolute;
        left: 0px;
        top: 15px;
        width: 360px;
        height: 640px; /* Exact 9:16 screen */
        border-radius: 34px;
        overflow: hidden;
        z-index: 8;
      }
      .phone-screen-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 34px;
        position: absolute;
        left: 0;
        top: 0;
        z-index: 8;
      }

      /* Overriding style classes for Large iPhone 16 Mockup in Frame 3 */
      .large-phone {
        width: 460px !important;
        height: 820px !important;
        border-radius: 54px !important;
        box-shadow:
          0 30px 60px rgba(0, 0, 0, 0.5),
          inset 0 0 15px rgba(255, 255, 255, 0.25),
          0 0 0 3px #111,
          0 0 0 5px #444,
          0 0 0 8px #222 !important;
      }
      .large-phone .phone-notch {
        width: 130px !important;
        height: 32px !important;
        border-radius: 16px !important;
        top: 18px !important;
      }
      .large-phone .phone-screen-container {
        width: 440px !important; /* 460 - 20 */
        height: 782px !important; /* 820 - 38 */
        border-radius: 44px !important;
        top: 20px !important;
      }

      /* Scene 2 (Gameplay Showcase) Elements */
      #phone-mockup {
        width: 380px;
        height: 675px;
        left: 770px;
        top: 190px;
        z-index: 5;
      }

      /* Video fits precisely inside portrait phone borders without distortion (aligned to 9:16 screen container offsets) */
      #gameplay-video {
        width: 360px;
        height: 640px;
        left: 780px; /* 770 + 10px outer border */
        top: 215px; /* 190 + 10px border + 15px top offset */
        object-fit: cover;
        border-radius: 34px;
        z-index: 8;
      }

      /* Side Text Cards styling */
      .side-card {
        width: 450px;
        background: #FFFDF9;
        border-radius: 28px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 12px 0 #D3C8B4, 0 15px 30px rgba(0,0,0,0.1);
        border: 4px solid #4E342E;
      }
      .side-card h2 {
        font-family: 'Nunito', sans-serif;
        font-weight: 900;
        font-size: 36px;
        color: #4E342E;
        line-height: 1.2;
      }
      #side-text-left {
        left: 200px;
        top: 380px;
      }
      #side-text-right {
        right: 200px;
        top: 380px;
      }

      /* Scene 3 (CTA & Leaderboard) Elements */
      #leaderboard-phone {
        width: 460px;
        height: 820px;
        left: 730px;
        top: 130px;
        z-index: 5;
      }

      #cta-area {
        left: 250px;
        top: 400px; /* Centered with top-right characters */
        width: 650px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      #cta-characters {
        position: absolute;
        right: -80px; /* Offset to the right of the title */
        top: -130px; /* Positioned above the title */
        display: flex;
        width: 420px;
        height: 260px;
        justify-content: flex-end;
        align-items: flex-end;
        z-index: 10;
      }
      .cta-title {
        font-size: 92px;
        font-weight: 900;
        color: #4E342E;
        text-shadow:
          -5px -5px 0 #FFFDF9,
          5px -5px 0 #FFFDF9,
          -5px 5px 0 #FFFDF9,
          5px 5px 0 #FFFDF9,
          0 12px 24px rgba(78, 52, 46, 0.25);
        margin-bottom: 40px;
        line-height: 1.1;
      }
      
      /* In-game button style (3D, borderless, yellow with brown text, press animations) */
      .cta-btn {
        display: inline-block;
        background: #FFD600;
        color: #4E342E;
        font-size: 42px;
        font-weight: 900;
        padding: 24px 60px;
        border-radius: 100px;
        text-decoration: none;
        box-shadow: 0 12px 0 #E0BC00, 0 15px 30px rgba(0, 0, 0, 0.15);
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }
      .cta-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 0 #E0BC00, 0 15px 30px rgba(0, 0, 0, 0.15);
      }
      .cta-btn:active {
        transform: translateY(8px);
        box-shadow: 0 4px 0 #E0BC00, 0 15px 30px rgba(0, 0, 0, 0.15);
      }

      #gk-cheer {
        position: relative;
        width: 260px;
        height: 260px;
        background-size: 520px 520px;
        background-position: 0px -260px;
        transform-origin: bottom center;
      }
      #striker-cheer {
        position: relative;
        width: 260px;
        height: 260px;
        background-size: 520px 520px;
        background-position: 0px 0px;
        margin-left: -130px; /* Tightly huddled! */
        transform-origin: bottom center;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-kbh8" id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
      <!-- Background & Ambient Layer (Track 1) -->
      <div data-hf-id="hf-dl9g" id="stadium-bg" class="clip" data-start="0" data-duration="20" data-track-index="1"></div>
      
      <!-- Ambient Clouds (Track 2) -->
      <div data-hf-id="hf-81k4" id="clouds-container" class="clip" data-start="0" data-duration="20" data-track-index="2">
        <div data-hf-id="hf-i50e" class="cloud cloud-1"></div>
        <div data-hf-id="hf-e6wd" class="cloud cloud-2"></div>
        <div data-hf-id="hf-b7ms" class="cloud cloud-3"></div>
      </div>
      
      <!-- Stage light glows (Tracks 3 and 4) -->
      <div data-hf-id="hf-upj4" id="glow-left" class="glow-light clip" data-start="0" data-duration="20" data-track-index="3"></div>
      <div data-hf-id="hf-5vzk" id="glow-right" class="glow-light clip" data-start="0" data-duration="20" data-track-index="4"></div>

      <!-- Main Audio Tracks (Tracks 20, 21, 22, 23) -->
      <audio data-hf-id="hf-dw45" id="bgm" src="music/bg.wav" data-start="0" data-duration="20" data-track-index="20" data-volume="0.45"></audio>
      <audio data-hf-id="hf-pmmk" id="sfx-save-1" src="music/save-1.mp3" data-start="1.8" data-duration="0.86" data-track-index="21" data-volume="0.9"></audio>
      <audio data-hf-id="hf-q2wm" id="sfx-save-2" src="music/save-1.mp3" data-start="5.2" data-duration="0.86" data-track-index="22" data-volume="0.9"></audio>
      <audio data-hf-id="hf-4vnc" id="sfx-save-3" src="music/save-1.mp3" data-start="8.1" data-duration="0.86" data-track-index="23" data-volume="0.9"></audio>

      <!-- ================= SCENE 1: HOOK (0s - 3s) ================= -->
      <!-- Track 5 for Logo -->
      <div data-hf-id="hf-wfrg" id="game-logo" class="clip" data-start="0" data-duration="3" data-track-index="5">
        <img data-hf-id="hf-52tw" class="logo-inner" src="assets/logo.png" alt="Logo">
      </div>
      
      <!-- Track 6 for Striker -->
      <div data-hf-id="hf-xejx" id="striker-cameo" class="clip" data-start="0" data-duration="3" data-track-index="6">
        <div data-hf-id="hf-zr34" class="sprite-cat striker-idle" id="striker-cameo-idle"></div>
        <div data-hf-id="hf-yrcz" class="sprite-cat striker-kick-right" id="striker-cameo-kick" style="opacity: 0;"></div>
      </div>

      <!-- Track 7 for Goalkeeper -->
      <div data-hf-id="hf-f2e0" id="gk-cameo" class="clip" data-start="0" data-duration="3" data-track-index="7">
        <div data-hf-id="hf-fk56" class="sprite-cat gk-idle" id="gk-cameo-idle"></div>
        <div data-hf-id="hf-bn1z" class="sprite-cat gk-dive-right" id="gk-cameo-dive" style="opacity: 0;"></div>
      </div>

      <!-- Track 8 for Football -->
      <img data-hf-id="hf-decp" id="intro-football" class="clip" data-start="0" data-duration="3" data-track-index="8" src="assets/football.png" style="width: 150px; height: 150px; opacity: 0;">


      <!-- ================= SCENE 2: GAMEPLAY (3s - 11s) ================= -->
      <!-- Track 5 for Portrait iPhone 16 mockup -->
      <div data-hf-id="hf-q5kc" id="phone-mockup" class="clip" data-start="3" data-duration="8" data-track-index="5">
        <div data-hf-id="hf-c59i" class="phone-frame portrait-phone">
          <div data-hf-id="hf-c27x" class="phone-notch"></div>
          <div data-hf-id="hf-5i6n" class="phone-screen-container"></div>
        </div>
      </div>
      
      <!-- Track 6 for Portrait Video (Direct root child required) -->
      <video data-hf-id="hf-a3o4" id="gameplay-video" class="clip" src="assets/gameplay_portrait.mp4" data-start="3" data-duration="8" data-track-index="6" muted playsinline></video>

      <!-- Side text overlays (Tracks 7 and 8) -->
      <div data-hf-id="hf-sllp" id="side-text-left" class="clip side-card" data-start="3" data-duration="8" data-track-index="7">
        <h2 data-hf-id="hf-68yk">Test Your Reflexes!</h2>
      </div>
      <div data-hf-id="hf-9oip" id="side-text-right" class="clip side-card" data-start="3" data-duration="8" data-track-index="8">
        <h2 data-hf-id="hf-m3yn">Can You Save It?</h2>
      </div>


      <!-- ================= SCENE 3: CTA & LEADERBOARD (11s - 20s) ================= -->
      <!-- Track 5 for Large Leaderboard phone mockup -->
      <div data-hf-id="hf-jamz" id="leaderboard-phone" class="clip" data-start="11" data-duration="9" data-track-index="5">
        <div data-hf-id="hf-9ja0" class="phone-frame portrait-phone large-phone">
          <div data-hf-id="hf-ce35" class="phone-notch"></div>
          <div data-hf-id="hf-xtv3" class="phone-screen-container">
            <img data-hf-id="hf-3h4p" class="phone-screen-image" src="assets/leaderboard_portrait.png" alt="Leaderboard">
          </div>
        </div>
      </div>

      <!-- Track 6 for CTA title & button -->
      <div data-hf-id="hf-xnsw" id="cta-area" class="clip" data-start="11" data-duration="9" data-track-index="6">
        <div data-hf-id="hf-whh2" id="cta-characters">
          <div data-hf-id="hf-ttxq" id="gk-cheer" class="sprite-cat gk-idle" data-layout-allow-occlusion=""></div>
          <div data-hf-id="hf-gcul" id="striker-cheer" class="sprite-cat striker-idle" data-layout-allow-occlusion=""></div>
        </div>
        <h1 data-hf-id="hf-bqvk" class="cta-title" data-layout-allow-occlusion="">Beat the<br data-hf-id="hf-x5px">Leaderboard!</h1>
        <a data-hf-id="hf-rt4e" class="cta-btn">Play Free Now!</a>
      </div>

    </div>

    <!-- GSAP Choreography Timeline -->
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.set("#gk-cheer", { y: 0, x: 0, data: "hf-hold" }, 0);

      // Ambient background & clouds movement (0s - 20s)
      tl.fromTo("#stadium-bg", { scale: 1.05 }, { scale: 1.0, duration: 20, ease: "none" }, 0);
      tl.to(".cloud-1", { x: 150, y: -20, duration: 20, ease: "none" }, 0);
      tl.to(".cloud-2", { x: -100, y: 15, duration: 20, ease: "none" }, 0);
      tl.to(".cloud-3", { x: 80, y: -10, duration: 20, ease: "none" }, 0);
      tl.fromTo(".glow-light", { opacity: 0.5 }, { opacity: 0.9, duration: 2.0, yoyo: true, repeat: 9, ease: "power1.inOut" }, 0);

      // --- SCENE 1: HOOK & INTRO (0s - 3s) ---
      // Logo bounce in (animating .logo-inner, not the clip wrapper)
      tl.fromTo("#game-logo .logo-inner", 
        { y: -450, scale: 0.2, opacity: 0 },
        { y: 0, scale: 1.0, opacity: 1, duration: 0.8, ease: "back.out(1.4)" },
        0.1
      );

      // Characters enter
      tl.fromTo("#gk-cameo", 
        { x: -500, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.6, ease: "power2.out" },
        0.3
      );
      tl.fromTo("#striker-cameo", 
        { x: 500, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.6, ease: "power2.out" },
        0.3
      );

      // KICK & SAVE CHOREOGRAPHY SEQUENCE
      // 1.0s: Striker winds up/kicks the ball
      tl.set("#striker-cameo-idle", { opacity: 0 }, 1.0);
      tl.set("#striker-cameo-kick", { opacity: 1 }, 1.0);

      // Ball launches from striker's foot to goalkeeper's hands
      tl.fromTo("#intro-football",
        { x: 1400, y: 800, scale: 0.3, opacity: 0, rotation: 0 },
        { x: 640, y: 720, scale: 2.2, opacity: 1, rotation: 360, duration: 0.8, ease: "power1.out" },
        1.0
      );

      // 1.3s: Striker returns to idle
      tl.set("#striker-cameo-idle", { opacity: 1 }, 1.3);
      tl.set("#striker-cameo-kick", { opacity: 0 }, 1.3);

      // 1.4s: Goalkeeper prepares and dives right (locks pose, no return to center)
      tl.set("#gk-cameo-idle", { opacity: 0 }, 1.4);
      tl.set("#gk-cameo-dive", { opacity: 1 }, 1.4);
      tl.to("#gk-cameo", { x: 160, y: -60, rotation: 15, duration: 0.4, ease: "power2.out" }, 1.4);

      // Ball bounces off back onto the goalkeeper (left side) and settles
      tl.to("#intro-football", { x: 550, y: 820, scale: 0.9, rotation: 180, duration: 0.6, ease: "bounce.out" }, 1.8);

      // Scene 1 Exit animations (sliding characters and logo away)
      tl.to("#game-logo .logo-inner", { y: -250, opacity: 0, scale: 0.7, duration: 0.4, ease: "power2.in" }, 2.6);
      tl.to("#gk-cameo", { x: -500, opacity: 0, duration: 0.4, ease: "power2.in" }, 2.6);
      tl.to("#striker-cameo", { x: 500, opacity: 0, duration: 0.4, ease: "power2.in" }, 2.6);
      tl.to("#intro-football", { opacity: 0, duration: 0.3 }, 2.4);

      // Hard kills at the boundary (3.0s) for robust seeking
      tl.set("#game-logo .logo-inner", { opacity: 0 }, 3.0);
      tl.set("#gk-cameo", { opacity: 0 }, 3.0);
      tl.set("#striker-cameo", { opacity: 0 }, 3.0);


      // --- SCENE 2: GAMEPLAY SHOWCASE (3s - 11s) ---
      // Phone Mockup & Video slide up from bottom
      tl.fromTo("#phone-mockup", 
        { y: 900, scale: 0.85, opacity: 0 },
        { y: 0, scale: 1.0, opacity: 1, duration: 0.8, ease: "back.out(1.1)" },
        3.0
      );
      tl.fromTo("#gameplay-video", 
        { y: 900, scale: 0.85, opacity: 0 },
        { y: 0, scale: 1.0, opacity: 1, duration: 0.8, ease: "back.out(1.1)" },
        3.0
      );

      // Side labels slide and scale in dynamically with a spin bounce
      tl.fromTo("#side-text-left",
        { x: -800, scale: 0.2, opacity: 0, rotation: -90 },
        { x: 0, scale: 1.0, opacity: 1, rotation: -4, duration: 0.8, ease: "back.out(1.8)" },
        3.3
      );
      tl.fromTo("#side-text-right",
        { x: 800, scale: 0.2, opacity: 0, rotation: 90 },
        { x: 0, scale: 1.0, opacity: 1, rotation: 4, duration: 0.8, ease: "back.out(1.8)" },
        3.5
      );

      // Gentle phone breathing motion in-place
      tl.to("#phone-mockup", { y: -12, duration: 1.8, yoyo: true, repeat: 3, ease: "power1.inOut" }, 3.8);
      tl.to("#gameplay-video", { y: -12, duration: 1.8, yoyo: true, repeat: 3, ease: "power1.inOut" }, 3.8);
      // Continuous floating/swaying for side cards (sine wave floating)
      tl.to("#side-text-left", { y: "-=18", x: "+=10", rotation: -8, duration: 2.0, yoyo: true, repeat: 3, ease: "sine.inOut" }, 4.3);
      tl.to("#side-text-right", { y: "-=18", x: "-=10", rotation: 8, duration: 2.0, yoyo: true, repeat: 3, ease: "sine.inOut" }, 4.3);

      // Scene 2 exit (slide leftwards)
      tl.to("#phone-mockup", { x: -1100, opacity: 0, duration: 0.6, ease: "power2.in" }, 10.3);
      tl.to("#gameplay-video", { x: -1100, opacity: 0, duration: 0.6, ease: "power2.in" }, 10.3);
      tl.to("#side-text-left", { x: -1100, opacity: 0, duration: 0.5, ease: "power2.in", overwrite: "auto" }, 10.2);
      tl.to("#side-text-right", { x: -1100, opacity: 0, duration: 0.5, ease: "power2.in", overwrite: "auto" }, 10.2);

      // Hard kills at the boundary (11.0s) for robust seeking
      tl.set(["#phone-mockup", "#gameplay-video", "#side-text-left", "#side-text-right"], { opacity: 0 }, 11.0);


      // --- SCENE 3: LEADERBOARD & CTA (11s - 15s) ---
      // Large Leaderboard phone mockup pops up dynamically at the center, then glides right
      tl.fromTo("#leaderboard-phone",
        { scale: 0.1, opacity: 0, rotation: -30, x: 0 },
        { scale: 1.2, opacity: 1, rotation: 12, duration: 0.6, ease: "back.out(1.5)" },
        11.0
      );
      tl.to("#leaderboard-phone", { scale: 1.0, duration: 0.2 }, 11.6);
      tl.to("#leaderboard-phone", { x: 520, rotation: -4, duration: 0.8, ease: "power2.inOut" }, 12.0);

      // CTA banner text & button slide in on the left once phone glides
      tl.fromTo("#cta-area",
        { x: -300, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.8, ease: "back.out(1.2)" },
        12.3
      );

      // Waving cat characters sway loop starting at 12.8s
      tl.fromTo("#gk-cheer",
        { rotation: -12 },
        { rotation: 12, duration: 0.7, yoyo: true, repeat: 10, ease: "sine.inOut" },
        12.8
      );
      tl.fromTo("#striker-cheer",
        { rotation: -12 },
        { rotation: 12, duration: 0.7, yoyo: true, repeat: 10, ease: "sine.inOut" },
        12.8
      );

      window.__timelines["main"] = tl;
    </script>
